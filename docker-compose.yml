services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evalua_frontend
    ports:
      - "8080:80"
    depends_on:
      - flutter_builder
      - backend

  flutter_builder:
    image: ghcr.io/cirruslabs/flutter:latest
    container_name: evalua_flutter_builder
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      bash -c "flutter pub get &&
               flutter build web"

  backend:
    build: ./backend
    container_name: evalua_backend
    volumes:
      - ./backend:/app
    ports:
      - "8888:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/evaluaplus
      - AI_SERVICE_URL=http://ai:8001
    depends_on:
      - db
      - ai

  ai:
    build: ./ai
    container_name: evalua_ai
    ports:
      - "8001:8001"
    volumes:
      - ./ai:/app
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: evalua_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: evaluaplus
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"